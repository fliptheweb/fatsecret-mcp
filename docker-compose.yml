services:
  mcp:
    build: .
    image: fatsecret-mcp:latest
    env_file: .env
    volumes:
      - ./data:/home/bun/.fatsecret-mcp
    restart: unless-stopped

  caddy:
    image: caddy:2
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
